<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:,">
<title>Commentarium · Research Studio</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- ===== SVG icon defs ===== -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-dna" viewBox="0 0 24 24"><path d="M9 2c0 5 6 5 6 10s-6 5-6 10"/><path d="M15 2c0 5-6 5-6 10s6 5 6 10"/><path d="M9.8 7h4.4M8.6 12h6.8M9.8 17h4.4"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 14a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></symbol>
  <symbol id="i-quote" viewBox="0 0 24 24"><path d="M11 7H7.5A3.5 3.5 0 0 0 4 10.5V17h7V7z" fill="currentColor" stroke="none"/><path d="M20 7h-3.5A3.5 3.5 0 0 0 13 10.5V17h7V7z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/><path d="M12 2v10"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72L19 12 8 5.14Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM15 5h3v14h-3z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 9 5-5 5 5"/><path d="M12 4v12"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<div class="app">
  <!-- ===== Rail ===== -->
  <nav class="rail">
    <div class="logo"><svg class="icon"><use href="#i-dna"/></svg></div>
    <button class="railbtn active" data-view="dashboard" data-tip="Dashboard"><svg class="icon"><use href="#i-home"/></svg></button>
    <button class="railbtn" data-view="library" data-tip="Library · Projects &amp; files"><svg class="icon"><use href="#i-book"/></svg></button>
    <button class="railbtn" data-view="chat" data-tip="Chat"><svg class="icon"><use href="#i-chat"/></svg></button>
    <button class="railbtn" data-view="podcast" data-tip="Podcast studio"><svg class="icon"><use href="#i-mic"/></svg></button>
    <button class="railbtn" data-view="citations" data-tip="Citations"><svg class="icon"><use href="#i-quote"/></svg></button>
    <button class="railbtn" data-view="ocr" data-tip="OCR to Markdown"><svg class="icon"><use href="#i-scan"/></svg></button>
    <div class="rspacer"></div>
    <button class="railbtn" data-view="settings" data-tip="Settings"><svg class="icon"><use href="#i-gear"/></svg></button>
    <button class="railbtn" data-view="logs" data-tip="Log viewer"><svg class="icon"><use href="#i-list"/></svg></button>
    <button class="railbtn" id="railExit" data-tip="Exit &amp; shut down servers" style="color:var(--err)"><svg class="icon"><use href="#i-power"/></svg></button>
  </nav>

  <!-- ===== Context panel (rendered per view by app.js) ===== -->
  <aside class="ctx" id="ctx"></aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <span class="crumb">Commentarium / <b id="crumbView">Dashboard</b></span>
      <div class="cmdpill" id="cmdOpen">
        <svg class="icon"><use href="#i-search"/></svg>Search or run a command…
        <span class="kbd" style="margin-left:auto">Ctrl K</span>
      </div>
      <div class="status" id="statusChips"></div>
      <div class="ttheme">
        <button class="tbtn" id="themeBtn" title="Toggle theme">
          <svg class="icon i-sun"><use href="#i-sun"/></svg>
          <svg class="icon i-moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- ===== Command palette ===== -->
<div class="overlay" id="paletteOverlay">
  <div class="pal">
    <input id="cmdInput" placeholder="Type a command or search…" autocomplete="off">
    <div class="pallist" id="cmdList"></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
